# Site settings. Restart `jekyll serve` after changing this file.

title: Saeed Hedayatian
first_name: Saeed
last_name: Hedayatian
email: saeedhed@usc.edu
description: PhD candidate in Computer Science at University of Southern California
lang: en
icon: favicon.png # a file in assets/img/
url: https://conflictednerd.github.io
baseurl: ""

blog_description: Interesting ideas, articles, topics, etc. Mainly et cetera. # shown beside the list of notes
google_analytics: G-Q6X3XJFDG7 # leave empty to turn analytics off

# Pages live in _pages/, notes in _posts/ (published at /blog/<year>/<title>/)
include: ["_pages"]
exclude: [Gemfile, Gemfile.lock, LICENSE, README.md, vendor]
permalink: /blog/:year/:title/

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

plugins:
  - jekyll-archives-v2 # tag, category and year pages for the notes
  - jekyll-feed # /feed.xml
  - jekyll-link-attributes # links to other sites open in a new tab
  - jekyll/scholar # publications from _bibliography/papers.bib
  - jekyll-sitemap # /sitemap.xml
  - jekyll-toc # the contents list beside notes that set `toc: true`

scholar:
  last_name: [Hedayatian] # this author is set in small caps in the list of publications
  first_name: [Saeed]
  source: /_bibliography/
  bibliography: papers.bib
  bibtex_filters: [latex, smallcaps, superscript]

jekyll-archives:
  posts:
    enabled: [year, tags, categories]
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank

# keep images, styles and scripts out of the sitemap
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
